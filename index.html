<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS CALC</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div id="calc">
        <h3>Calculadora</h3>
        <div id="operations">
            <div id="previous-operation">
                
            </div>
            <div id="current-operation">
                
            </div>
        </div>
        <div id="buttons-container">
            <button>CE</button>
            <button>C</button>
            <button>DEL</button>
            <button>/</button>
            <button>8</button>
            <button id="number">7</button>
            <button id="number">9</button>
            <button>*</button>
            <button id="number">4</button>
            <button id="number">5</button>
            <button id="number">6</button>
            <button>-</button>
            <button id="number">1</button>
            <button id="number">2</button>
            <button id="number">3</button>
            <button>+</button>
            <button id="number">0</button>
            <button id="number">.</button>
            <button id="equal-btn">=</button>
        </div>
    </div>
</body>

</html>
